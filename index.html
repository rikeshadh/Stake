<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stake AI - Autonomous Institutional Equities</title>
    <script>
      // Suppress benign Vite WebSocket disconnect errors in sandboxed preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason.message || '').includes('WebSocket') ||
          String(event.reason).includes('failed to connect to websocket')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (
          String(event.message || '').includes('WebSocket') ||
          String(event.message || '').includes('failed to connect to websocket')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400;1,6..72,600;1,6..72,700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
